name: Bug report
description: Report a HeapScope bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HeapScope. Please avoid pasting secrets or heap values.
  - type: input
    id: version
    attributes:
      label: HeapScope version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: ruby
    attributes:
      label: Ruby version / engine
      placeholder: "3.4.10 (ruby)"
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: `heapscope doctor` / capabilities output
      render: shell
  - type: textarea
    id: expect
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Prefer synthetic scripts without production data.
